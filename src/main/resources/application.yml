spring:
  application:
    name: ai-no-code-platform
server:
  port: 8000
  servlet:
    context-path: /api

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.gjq.ainocodeplatform.controller

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
